<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>Claude Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"/>
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #242424;
      --border: #2e2e2e;
      --accent: #7c6df0;
      --text: #e8e8e8;
      --text-dim: #888;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }

    #app { display: flex; flex-direction: column; height: 100dvh; }

    /* ── Tab bar ── */
    #tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tab {
      flex: 1; padding: 14px; text-align: center; cursor: pointer;
      font-size: 14px; font-weight: 500; color: var(--text-dim);
      border-bottom: 2px solid transparent; transition: all .15s;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Panels ── */
    #panel-files, #panel-terminal { flex: 1; overflow: hidden; display: none; flex-direction: column; }
    #panel-files.active, #panel-terminal.active { display: flex; }

    /* ── File browser ── */
    #breadcrumb {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border);
      font-size: 13px; color: var(--text-dim); flex-shrink: 0;
    }
    .crumb { cursor: pointer; color: var(--accent); }
    .crumb:hover { text-decoration: underline; }
    .crumb-sep { color: var(--border); }

    #open-here-bar {
      display: none;
      padding: 10px 14px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #open-here-btn {
      width: 100%; padding: 11px;
      background: var(--accent); color: #fff; border: none;
      border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    #open-here-btn:hover { filter: brightness(1.1); }

    #file-list { flex: 1; overflow-y: auto; }
    .file-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      cursor: pointer; transition: background .12s;
    }
    .file-item:hover { background: var(--surface2); }
    .file-icon { font-size: 20px; flex-shrink: 0; }
    .file-name { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-arrow { margin-left: auto; color: var(--text-dim); font-size: 18px; flex-shrink: 0; }
    #file-empty { padding: 32px; text-align: center; color: var(--text-dim); font-size: 14px; }

    /* ── Session picker bottom sheet ── */
    #sheet-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20;
    }
    #sheet-overlay.open { opacity: 1; pointer-events: all; }
    #session-sheet {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: var(--surface); border-radius: 16px 16px 0 0;
      padding: 0 0 max(16px, env(safe-area-inset-bottom));
      transform: translateY(100%); transition: transform .3s; z-index: 21;
      max-height: 70dvh; display: flex; flex-direction: column;
    }
    #session-sheet.open { transform: translateY(0); }
    #sheet-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 0; flex-shrink: 0; }
    #sheet-title { padding: 14px 18px 10px; font-weight: 600; font-size: 16px; flex-shrink: 0; border-bottom: 1px solid var(--border); }
    #sheet-list { overflow-y: auto; flex: 1; padding: 8px 12px; }
    .sheet-item {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 8px; border-bottom: 1px solid var(--border); cursor: pointer;
      border-radius: 8px; transition: background .12s;
    }
    .sheet-item:last-child { border-bottom: none; }
    .sheet-item:hover, .sheet-item:active { background: var(--surface2); }
    .sheet-item-icon { font-size: 22px; flex-shrink: 0; }
    .sheet-item-body { flex: 1; overflow: hidden; }
    .sheet-item-title { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sheet-item-meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .sheet-item-new .sheet-item-title { color: var(--accent); font-weight: 600; }
    .sheet-preview { margin-top: 8px; border-left: 2px solid var(--border); padding-left: 10px; display: flex; flex-direction: column; gap: 5px; }
    .preview-line { font-size: 12px; line-height: 1.5; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .preview-line.user { color: #a5b4fc; }
    .preview-line.assistant { color: var(--text-dim); }

    /* ── Terminal ── */
    #terminal-header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border);
      font-size: 13px; flex-shrink: 0;
    }
    #terminal-path { flex: 1; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #reconnect-btn {
      padding: 5px 12px; background: var(--surface2); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; font-size: 12px; cursor: pointer;
    }
    #terminal-wrap { flex: 1; overflow: hidden; padding: 4px; }
    #xterm-container { width: 100%; height: 100%; }

    /* ── Virtual key bar (mobile) ── */
    #keybar {
      display: flex; gap: 4px; padding: 6px;
      background: var(--surface); border-top: 1px solid var(--border);
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      flex-shrink: 0;
      padding-bottom: max(6px, env(safe-area-inset-bottom));
    }
    #keybar::-webkit-scrollbar { display: none; }
    .kb {
      flex-shrink: 0; min-width: 44px; padding: 9px 11px;
      background: var(--surface2); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 13px; font-family: "SF Mono", Menlo, monospace;
      cursor: pointer; user-select: none; -webkit-user-select: none;
      transition: background .1s;
    }
    .kb:active { background: var(--accent); color: #fff; }
  </style>
</head>
<body>
<div id="app">
  <div id="tabs">
    <div class="tab active" data-tab="files">📁 文件</div>
    <div class="tab" data-tab="terminal">⌨️ 终端</div>
  </div>

  <!-- Session picker sheet -->
  <div id="sheet-overlay"></div>
  <div id="session-sheet">
    <div id="sheet-handle"></div>
    <div id="sheet-title">选择对话</div>
    <div id="sheet-list"></div>
  </div>

  <!-- File browser -->
  <div id="panel-files" class="active">
    <div id="breadcrumb"><span class="crumb" data-path="">根目录</span></div>
    <div id="open-here-bar">
      <button id="open-here-btn">▶ 在此目录打开 Claude 终端</button>
    </div>
    <div id="file-list"></div>
  </div>

  <!-- Terminal -->
  <div id="panel-terminal">
    <div id="terminal-header">
      <span id="terminal-path">未打开</span>
      <button id="reconnect-btn">重连</button>
    </div>
    <div id="terminal-wrap">
      <div id="xterm-container"></div>
    </div>
    <div id="keybar"></div>
  </div>
</div>

<script>
  // ── Tab switching ──
  let activeTab = "files";
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      activeTab = tab.dataset.tab;
      document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === activeTab));
      document.getElementById("panel-files").classList.toggle("active", activeTab === "files");
      document.getElementById("panel-terminal").classList.toggle("active", activeTab === "terminal");
      if (activeTab === "terminal") fitTerm();
    });
  });

  // ── File browser ──
  let currentPath = "";
  let pathStack = [{ label: "根目录", path: "" }];

  async function loadFiles(path) {
    currentPath = path;
    const res = await fetch("/api/files?path=" + encodeURIComponent(path));
    const items = await res.json();
    renderBreadcrumb();

    const bar = document.getElementById("open-here-bar");
    bar.style.display = path ? "block" : "none";

    const list = document.getElementById("file-list");
    list.innerHTML = "";

    if (!items.length) {
      list.innerHTML = '<div id="file-empty">此目录为空</div>';
      return;
    }

    items.forEach(item => {
      const el = document.createElement("div");
      el.className = "file-item";
      const icon = item.type === "dir" ? "📁" : getFileIcon(item.name);
      el.innerHTML = `
        <span class="file-icon">${icon}</span>
        <span class="file-name">${item.name}</span>
        ${item.type === "dir" ? '<span class="file-arrow">›</span>' : ""}
      `;
      if (item.type === "dir") {
        el.addEventListener("click", () => {
          pathStack.push({ label: item.name, path: item.path });
          loadFiles(item.path);
        });
      }
      list.appendChild(el);
    });
  }

  function renderBreadcrumb() {
    const bc = document.getElementById("breadcrumb");
    bc.innerHTML = "";
    pathStack.forEach((crumb, i) => {
      const span = document.createElement("span");
      span.className = "crumb";
      span.textContent = crumb.label;
      span.dataset.path = crumb.path;
      span.addEventListener("click", () => {
        pathStack = pathStack.slice(0, i + 1);
        loadFiles(crumb.path);
      });
      bc.appendChild(span);
      if (i < pathStack.length - 1) {
        const sep = document.createElement("span");
        sep.className = "crumb-sep";
        sep.textContent = "/";
        bc.appendChild(sep);
      }
    });
  }

  function getFileIcon(name) {
    const ext = name.split(".").pop().toLowerCase();
    const map = { py: "🐍", js: "📜", ts: "📘", json: "📋", md: "📝", txt: "📄", sh: "⚙️", html: "🌐", css: "🎨", jpg: "🖼️", png: "🖼️", gif: "🖼️", pdf: "📕", zip: "📦", tar: "📦", gz: "📦" };
    return map[ext] || "📄";
  }

  document.getElementById("open-here-btn").addEventListener("click", () => {
    showSessionPicker(currentPath);
  });

  // ── Session picker ──
  const sheetOverlay = document.getElementById("sheet-overlay");
  const sessionSheet = document.getElementById("session-sheet");
  const sheetList = document.getElementById("sheet-list");

  function closeSheet() {
    sessionSheet.classList.remove("open");
    sheetOverlay.classList.remove("open");
  }
  sheetOverlay.addEventListener("click", closeSheet);

  async function showSessionPicker(path) {
    sheetList.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-dim)">加载中...</div>';
    sessionSheet.classList.add("open");
    sheetOverlay.classList.add("open");

    const sessions = await fetch("/api/claude-sessions?path=" + encodeURIComponent(path)).then(r => r.json());

    sheetList.innerHTML = "";

    // "新建对话" always at top
    const newItem = makeSheetItem("✦", "新建对话", "从头开始一个新的 Claude 会话", true);
    newItem.addEventListener("click", () => { closeSheet(); openTerminal(path, ""); });
    sheetList.appendChild(newItem);

    sessions.forEach(s => {
      const item = makeSessionItem(s);
      item.addEventListener("click", () => { closeSheet(); openTerminal(path, s.id); });
      sheetList.appendChild(item);
    });

    if (!sessions.length) {
      const empty = document.createElement("div");
      empty.style.cssText = "padding:16px 8px;color:var(--text-dim);font-size:13px;";
      empty.textContent = "该目录暂无历史会话";
      sheetList.appendChild(empty);
    }
  }

  function makeSheetItem(icon, title, meta, isNew) {
    const el = document.createElement("div");
    el.className = "sheet-item" + (isNew ? " sheet-item-new" : "");
    el.innerHTML = `
      <span class="sheet-item-icon">${icon}</span>
      <div class="sheet-item-body">
        <div class="sheet-item-title">${title}</div>
        <div class="sheet-item-meta">${meta}</div>
      </div>
    `;
    return el;
  }

  function makeSessionItem(s) {
    const el = document.createElement("div");
    el.className = "sheet-item";

    let previewHtml = "";
    if (s.preview && s.preview.length) {
      const lines = s.preview.map(m =>
        `<div class="preview-line ${m.role}">${m.role === "user" ? "你：" : "Claude："}${escHtml(m.text)}</div>`
      ).join("");
      previewHtml = `<div class="sheet-preview">${lines}</div>`;
    }

    el.innerHTML = `
      <span class="sheet-item-icon">🕘</span>
      <div class="sheet-item-body">
        <div class="sheet-item-title">${escHtml(s.title)}</div>
        <div class="sheet-item-meta">${s.last_modified} · ${s.message_count} 条消息</div>
        ${previewHtml}
      </div>
    `;
    return el;
  }

  function escHtml(str) {
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  // ── Terminal (xterm.js) ──
  const term = new Terminal({
    theme: { background: "#0f0f0f", foreground: "#e8e8e8", cursor: "#7c6df0" },
    fontSize: 14,
    fontFamily: '"SF Mono", Menlo, "Cascadia Code", monospace',
    cursorBlink: true,
    scrollback: 2000,
  });
  const fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById("xterm-container"));

  // ── Virtual key bar ──
  const KEYS = [
    { label: "Esc",  send: "\x1b" },
    { label: "Tab",  send: "\t" },
    { label: "↑",    send: "\x1b[A" },
    { label: "↓",    send: "\x1b[B" },
    { label: "←",    send: "\x1b[D" },
    { label: "→",    send: "\x1b[C" },
    { label: "^C",   send: "\x03" },
    { label: "^D",   send: "\x04" },
    { label: "Clr",  send: "\x0c" },
    { label: "/",    send: "/" },
    { label: "|",    send: "|" },
    { label: "Home", send: "\x1b[H" },
    { label: "End",  send: "\x1b[F" },
  ];
  const keybar = document.getElementById("keybar");
  KEYS.forEach(k => {
    const btn = document.createElement("button");
    btn.className = "kb";
    btn.textContent = k.label;
    // Prevent focus loss so mobile soft keyboard stays open
    btn.addEventListener("mousedown", e => e.preventDefault());
    btn.addEventListener("touchstart", e => e.preventDefault(), { passive: false });
    btn.addEventListener("click", () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "input", data: k.send }));
      }
    });
    keybar.appendChild(btn);
  });

  let ws = null;
  let termPath = "";
  let termSessionId = "";
  let dataDisposable = null;
  let autoReconnect = false;

  function fitTerm() {
    try {
      fitAddon.fit();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "resize", rows: term.rows, cols: term.cols }));
      }
    } catch(e) {}
  }

  window.addEventListener("resize", fitTerm);

  function openTerminal(path, sessionId = "") {
    termPath = path;
    termSessionId = sessionId;
    autoReconnect = true;
    document.getElementById("terminal-path").textContent = path || "~";

    // Switch to terminal tab
    activeTab = "terminal";
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === "terminal"));
    document.getElementById("panel-files").classList.remove("active");
    document.getElementById("panel-terminal").classList.add("active");

    connectTerminal(path, sessionId);
  }

  function connectTerminal(path, sessionId = "") {
    if (ws) { ws.close(); ws = null; }
    term.clear();
    term.writeln("\x1b[90m正在连接...\x1b[0m");

    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    let url = `${proto}//${location.host}/terminal?path=${encodeURIComponent(path)}&token=__WS_TOKEN__`;
    if (sessionId) url += `&session_id=${encodeURIComponent(sessionId)}`;
    ws = new WebSocket(url);
    ws.binaryType = "arraybuffer";

    ws.onopen = () => {
      term.clear();
      setTimeout(fitTerm, 100);
    };

    ws.onmessage = ({ data }) => {
      term.write(typeof data === "string" ? data : new Uint8Array(data));
    };

    ws.onclose = () => {
      term.writeln("\r\n\x1b[33m[连接断开，3秒后自动恢复会话...]\x1b[0m");
      if (autoReconnect) setTimeout(async () => {
        try {
          const res = await fetch("/api/latest-session?path=" + encodeURIComponent(termPath));
          const { session_id } = await res.json();
          if (session_id) termSessionId = session_id;
        } catch(e) {}
        connectTerminal(termPath, termSessionId);
      }, 3000);
    };
    ws.onerror = () => term.writeln("\r\n\x1b[31m[连接错误]\x1b[0m");

    if (dataDisposable) { dataDisposable.dispose(); dataDisposable = null; }
    dataDisposable = term.onData(data => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "input", data }));
      }
    });
  }

  document.getElementById("reconnect-btn").addEventListener("click", () => {
    autoReconnect = false; // 手动点重连，先停自动重连倒计时
    showSessionPicker(termPath);
  });

  // ── Init ──
  loadFiles("");
</script>
</body>
</html>
